<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Portfolio of Rhico: multimedia design, digital and traditional art, and development work." />
        <meta name="color-scheme" content="dark light" />
        <meta property="og:title" content="Rhico — Multimedia Designer" />
        <meta property="og:description" content="Multimedia design, digital and traditional art, and development work." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://rhico.co.za" />
        <link rel="canonical" href="https://rhico.co.za" />
        <title>Rhico — Multimedia Designer</title>
        <script>
            // Apply the persisted theme before first paint to avoid a flash.
            (function () {
                try {
                    var stored = localStorage.getItem('rhico-theme');
                    var prefers_dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var theme = stored || (prefers_dark ? 'dark' : 'light');
                    document.documentElement.classList.toggle('dark', theme === 'dark');
                } catch (error) {
                    // localStorage can throw in private mode; fall back to the default dark class.
                }
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
